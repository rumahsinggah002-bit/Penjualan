:root{--bg:#EEF1F6;--card:#fff;--ink:#1B2330;--mut:#7A8594;--line:#E4E8EF;--key:#F3F5F9;--gt:#2E9E72;--rt:#C8382F;--p:#5B50E6;--sh:0 1px 2px rgba(27,35,48,.05),0 8px 22px rgba(27,35,48,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1210;--card:#151E1A;--ink:#E8EFEB;--mut:#8D9C95;--line:#25332D;--key:#1D2924;--gt:#4CC49A;--rt:#F07A74;--p:#7A70F5;--sh:0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0C1210;--card:#151E1A;--ink:#E8EFEB;--mut:#8D9C95;--line:#25332D;--key:#1D2924;--gt:#4CC49A;--rt:#F07A74;--p:#7A70F5;--sh:0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 'BMB',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:22px;flex:none}
.hd h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hd small{color:var(--mut);font-size:13px}
.hd>div{flex:1;min-width:0}
.mn{width:40px;height:40px;border:0;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:20px;position:relative}
.pop{position:absolute;right:0;top:46px;background:var(--card);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:6px;z-index:20;width:210px;display:none}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:14px}
.pop button:last-child{color:var(--rt)}
.bal{border-radius:24px;padding:18px 20px 16px;color:#fff;background:linear-gradient(145deg,#3FAE84,#6CCBA4 70%,#84D6B3);box-shadow:0 12px 28px rgba(63,174,132,.3)}
.bt{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.95}
.pill{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;font-size:12px}
.tot{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.2;margin:6px 0 14px;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.two div:first-child{border-right:1px solid rgba(255,255,255,.3)}
.two b{display:block;font-size:17px;margin-top:2px;word-break:break-all}
.two span{font-size:12.5px;opacity:.9}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 6px}
.btns button{border:0;border-radius:16px;height:54px;color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.btns button:active,.fab:active{transform:scale(.97)}
.bg{background:linear-gradient(135deg,#43B488,#6CCBA4)}.br{background:linear-gradient(135deg,#D9534F,#EE8079)}
.ci{width:22px;height:22px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;padding-bottom:1px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 6px}
.sec h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.sec button{border:0;background:none;color:var(--p);font-size:14px;font-weight:600;padding:4px}
.dh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:14px 2px 8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:22px;font-weight:700;flex:none;box-shadow:0 5px 12px rgba(0,0,0,.14)}
.ic.p{background:linear-gradient(135deg,#43B488,#6CCBA4)}.ic.m{background:linear-gradient(135deg,#D9534F,#EE8079)}
.n{flex:1;min-width:0}.n b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n span{font-size:12.5px;color:var(--mut)}
.v{font-weight:800;white-space:nowrap}.v.p{color:var(--gt)}.v.m{color:var(--rt)}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:2px 6px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:18px;background:var(--p);color:#fff;font-weight:700;font-size:15px;padding:15px 20px;box-shadow:0 10px 24px rgba(91,80,230,.45)}
.ov{position:fixed;inset:0;background:rgba(10,16,13,.5);display:none;z-index:30}
.ov.on{display:block}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--key);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;padding:10px;background:none;font-weight:600}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:var(--sh)}
.amt{font-size:38px;font-weight:800;text-align:right;letter-spacing:-.5px;margin:14px 4px 0;min-height:48px;word-break:break-all}
.amt.e{opacity:.3}
.note{width:100%;border:0;background:var(--key);color:var(--ink);border-radius:12px;padding:12px 13px;margin-top:8px;font:inherit;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{height:52px;border:0;border-radius:14px;background:var(--key);font-size:21px;font-weight:600}
.pad button:active{filter:brightness(.93)}
.ok{width:100%;margin-top:10px;height:56px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:16px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{position:relative}
.mb{width:100%;border:0;background:var(--card);border-radius:18px;padding:14px 6px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px}
.mb:active{transform:scale(.96)}
.me{font-size:30px;line-height:1.2}
.mb b{font-size:13px;font-weight:700;line-height:1.25}
.mp{font-size:12px;color:var(--mut)}
.bd{position:absolute;top:-6px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--p);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;pointer-events:none}
.mm2{position:absolute;top:-6px;left:-4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--rt);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;padding:0 0 2px}
.bh{margin:2px 0 4px;font-size:18px;font-weight:800}
.fl{display:block;font-size:13px;color:var(--mut);margin:12px 2px 6px}
.qr{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.qr button{height:52px;border:0;border-radius:14px;background:var(--key);font-size:24px;font-weight:600}
.qr input{height:52px;border:0;border-radius:14px;background:var(--key);color:var(--ink);text-align:center;font:inherit;font-size:22px;font-weight:700;width:100%}
.chs{display:flex;gap:8px;margin-top:8px}
.chs button{flex:1;border:0;border-radius:12px;background:var(--key);padding:10px 0;font-size:14px;font-weight:600}
.bs{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.bs b{font-size:22px}
</style>
</head>
<body>
<main>
<div class="hd">
  <div class="logo">🔥</div>
  <div><h1>Bakaran Mas Bios</h1><small id="dt"></small></div>
  <div style="position:relative;flex:none"><button class="mn" id="mn" type="button" aria-label="Menu">⋮</button>
    <div class="pop" id="pop"><button id="cp" type="button">Salin rekap hari ini</button><button id="clr" type="button">Hapus semua data</button></div></div>
</div>

<section class="bal">
  <div class="bt"><span>Saldo hari ini</span><span class="pill">Hari ini</span></div>
  <div class="tot" id="tot">Rp0</div>
  <div class="two"><div><span>↑ Total masuk</span><b id="mi">Rp0</b></div><div><span>↓ Total keluar</span><b id="mo">Rp0</b></div></div>
</section>

<div class="btns">
  <button class="bg" id="ai" type="button"><span class="ci">+</span>Tambah Pemasukan</button>
  <button class="br" id="ao" type="button"><span class="ci">−</span>Tambah Pengeluaran</button>
</div>

<div class="sec"><h2>Menu Cepat</h2></div>
<div class="menu" id="menu"></div>

<div class="sec"><h2>Transaksi Terbaru</h2><button id="all" type="button" hidden>Lihat semua</button></div>
<div id="list"></div>
</main>

<button class="fab" id="fab" type="button">+ Catat</button>

<div class="ov" id="ov">
 <div class="sh" role="dialog" aria-label="Catat transaksi">
  <div class="seg"><button id="sI" type="button">Pemasukan</button><button id="sO" type="button">Pengeluaran</button></div>
  <div class="amt e" id="amt">0</div>
  <input class="note" id="note" placeholder="Catatan, mis. beli es batu (boleh kosong)" maxlength="60">
  <div class="pad" id="pad"></div>
  <button class="ok" id="ok" type="button">Simpan</button>
 </div>
</div>

<div class="ov" id="ov2">
 <div class="sh" role="dialog" aria-label="Bakaran">
  <h3 class="bh">🍢 Bakaran</h3>
  <label class="fl" for="bqv">Jumlah</label>
  <div class="qr"><button type="button" id="bqm" aria-label="Kurangi">−</button><input id="bqv" type="number" inputmode="numeric" min="1" value="1"><button type="button" id="bqp" aria-label="Tambah">+</button></div>
  <label class="fl" for="bp">Harga satuan (Rp)</label>
  <input class="note" id="bp" type="number" inputmode="numeric" min="0" placeholder="mis. 2000" style="margin-top:0">
  <div class="chs" id="bch"><button type="button" data-v="1000">1.000</button><button type="button" data-v="2000">2.000</button><button type="button" data-v="3000">3.000</button><button type="button" data-v="5000">5.000</button></div>
  <div class="bs"><span>Total</span><b id="btot">Rp0</b></div>
  <button class="ok" id="bok" type="button" style="background:linear-gradient(135deg,#43B488,#6CCBA4)">Tambah bakaran</button>
 </div>
</div>

<script>
(function(){
var KEY='kj1',S=[],cur='',tp=1,all=false,NAME='Bakaran Mas Bios';
try{S=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){S=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var fm=function(n){return 'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID')};
var rp=function(n){return (n<0?'−':'')+fm(n)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dk(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dl(t){return new Date(t).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function sums(){var k=dk(Date.now()),a=0,b=0;S.forEach(function(x){if(dk(x.t)===k){if(x.v>0)a+=x.v;else b-=x.v}});return[a,b]}
['7','8','9','4','5','6','1','2','3','000','0','⌫'].forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=k;
 b.setAttribute('aria-label',k==='⌫'?'Hapus angka':k);
 b.onclick=function(){if(k==='⌫')cur=cur.slice(0,-1);else if(cur.length<12){if(cur===''&&(k==='0'||k==='000'))return;cur+=k}amt()};
 $('pad').appendChild(b)});
function amt(){var a=$('amt');if(!cur){a.textContent='0';a.className='amt e'}else{a.textContent=(+cur).toLocaleString('id-ID');a.className='amt'}}
function setType(v){tp=v;$('sI').setAttribute('aria-pressed',v>0);$('sO').setAttribute('aria-pressed',v<0);
 var o=$('ok');o.textContent=v>0?'Simpan pemasukan':'Simpan pengeluaran';o.style.background=v>0?'linear-gradient(135deg,#43B488,#6CCBA4)':'linear-gradient(135deg,#D9534F,#EE8079)'}
function openS(v){cur='';$('note').value='';amt();setType(v);$('ov').classList.add('on')}
function closeS(){$('ov').classList.remove('on')}
$('ai').onclick=$('fab').onclick=function(){openS(1)};
$('ao').onclick=function(){openS(-1)};
$('sI').onclick=function(){setType(1)};$('sO').onclick=function(){setType(-1)};
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeS()});
$('ok').onclick=function(){var v=+cur;if(!v)return;
 S.push({id:Date.now(),t:Date.now(),v:tp*v,n:$('note').value.trim()});save();closeS();render()};
$('mn').onclick=function(e){e.stopPropagation();$('pop').classList.toggle('on')};
document.addEventListener('click',function(){$('pop').classList.remove('on')});
$('all').onclick=function(){all=!all;render()};
function render(){
 var m=sums();$('tot').textContent=rp(m[0]-m[1]);$('mi').textContent=fm(m[0]);$('mo').textContent=fm(m[1]);
 $('dt').textContent=dl(Date.now());
 var L=S.slice().sort(function(a,b){return b.t-a.t}),V=all?L:L.slice(0,8),h='',last='',net={};
 L.forEach(function(x){var k=dk(x.t);net[k]=(net[k]||0)+x.v});
 $('all').hidden=L.length<=8;$('all').textContent=all?'Ringkas':'Lihat semua';
 if(!L.length)h='<div class="empty">Belum ada transaksi. Tekan Tambah Pemasukan atau Tambah Pengeluaran.</div>';
 V.forEach(function(x){var k=dk(x.t),p=x.v>0;
  if(k!==last){last=k;h+='<div class="dh"><span>'+dl(x.t)+'</span><span>'+rp(net[k])+'</span></div>'}
  var tm=new Date(x.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  h+='<div class="it"><i class="ic '+(p?'p':'m')+'">'+(p?'↑':'↓')+'</i><div class="n"><b>'+(x.n?esc(x.n):(p?'Pemasukan':'Pengeluaran'))+'</b><span>'+tm+'</span></div><div class="v '+(p?'p':'m')+'">'+(p?'+':'−')+fm(x.v)+'</div><button class="x" type="button" data-d="'+x.id+'" aria-label="Hapus transaksi">×</button></div>'});
 $('list').innerHTML=h;renderMenu()}
$('list').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(!b)return;
 S=S.filter(function(x){return String(x.id)!==b.dataset.d});save();render()});
$('clr').onclick=function(){if(S.length&&confirm('Hapus semua data? Ini tidak bisa dibatalkan.')){S=[];save();render()}};
$('cp').onclick=function(){var m=sums(),t=NAME+'\nRekap '+dl(Date.now())+'\nMasuk: '+fm(m[0])+'\nKeluar: '+fm(m[1])+'\nSaldo: '+rp(m[0]-m[1]);
 try{navigator.clipboard.writeText(t).then(function(){alert('Rekap tersalin')},function(){alert(t)})}catch(e){alert(t)}};
var MENU=[{k:'teh',n:'Teh / Es Teh',e:'🍵',p:3000},{k:'kopi',n:'Kopi / Es Kopi',e:'☕',p:4000}],bq=1;
function nid(){return Date.now()+'-'+Math.random().toString(36).slice(2,6)}
function cnt(k){var d=dk(Date.now()),c=0;S.forEach(function(x){if(x.m===k&&dk(x.t)===d)c+=x.q||1});return c}
function renderMenu(){var h='';
 MENU.forEach(function(m){var c=cnt(m.k);
  h+='<div class="mc"><button type="button" class="mb" data-add="'+m.k+'"><span class="me">'+m.e+'</span><b>'+m.n+'</b><span class="mp">'+fm(m.p)+'</span></button>'+(c?'<span class="bd">'+c+'</span><button type="button" class="mm2" data-sub="'+m.k+'" aria-label="Kurangi '+m.n+'">−</button>':'')+'</div>'});
 var c=cnt('bakaran');
 h+='<div class="mc"><button type="button" class="mb" id="bk"><span class="me">🍢</span><b>Bakaran</b><span class="mp">Atur sendiri</span></button>'+(c?'<span class="bd">'+c+'</span>':'')+'</div>';
 $('menu').innerHTML=h}
$('menu').addEventListener('click',function(e){
 var a=e.target.closest('[data-add]'),s=e.target.closest('[data-sub]');
 if(a){var m=MENU.filter(function(x){return x.k===a.dataset.add})[0];
  S.push({id:nid(),t:Date.now(),v:m.p,n:m.n,m:m.k,q:1});save();render();return}
 if(s){var k=s.dataset.sub,d=dk(Date.now()),i=-1;
  for(var j=S.length-1;j>=0;j--){if(S[j].m===k&&dk(S[j].t)===d){i=j;break}}
  if(i>=0){S.splice(i,1);save();render()}return}
 if(e.target.closest('#bk'))openB()});
function bt(){$('btot').textContent=fm(bq*(+$('bp').value||0))}
function openB(){bq=1;$('bqv').value=1;var lp='';try{lp=localStorage.getItem('bp1')||''}catch(e){}
 $('bp').value=lp;bt();$('ov2').classList.add('on')}
$('bqm').onclick=function(){bq=Math.max(1,bq-1);$('bqv').value=bq;bt()};
$('bqp').onclick=function(){bq=Math.min(999,bq+1);$('bqv').value=bq;bt()};
$('bqv').addEventListener('input',function(){bq=Math.max(1,Math.min(999,parseInt(this.value,10)||1));bt()});
$('bp').addEventListener('input',bt);
$('bch').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$('bp').value=b.dataset.v;bt()});
$('bok').onclick=function(){var p=+$('bp').value;if(!p){$('bp').focus();return}
 try{localStorage.setItem('bp1',p)}catch(e){}
 S.push({id:nid(),t:Date.now(),v:bq*p,n:'Bakaran ×'+bq,m:'bakaran',q:bq});save();$('ov2').classList.remove('on');render()};
$('ov2').addEventListener('click',function(e){if(e.target===$('ov2'))$('ov2').classList.remove('on')});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
